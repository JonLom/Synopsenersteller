[pytest]
# Pytest configuration for Synopsenersteller

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    -v
    --tb=short
    --strict-markers

# Test paths
testpaths = tests

# Markers
markers =
    integration: Integration tests (requires API access, may incur costs)
    unit: Unit tests (no external dependencies)
